# npm run dist:desktop 用这份配置打包（见根 package.json 的 dist:desktop 脚本）。
# 跑法：npm run build（server + web）→ npm run build -w desktop（编译 main.ts）
# → electron-builder --config desktop/electron-builder.yml，cwd 是仓库根。
#
# 下面几处路径能不能对上，直接决定 desktop/src/paths.ts 算出来的 resolvePaths()
# 在打包后是不是真的成立——三条硬前提（转给这个 Task 的审查意见）：
#   1) AGENTS.md 和 workflows/ 必须进 extraResources，否则 ensureAgentFiles()
#      首次启动 cpSync 就是 ENOENT。
#   2) server/dist、web/dist 也要进 extraResources、不能进 asar：server/src/index.ts 顶上那段
#      用 join(here,'..','..') 从「自己所在目录」往上两级找 web/dist，把 server/dist
#      放在 <resourcesPath>/server/dist/ 正好让这个相对关系在打包后继续成立
#      （<resourcesPath>/server/dist/.. /.. = <resourcesPath>，web/dist 在它下面）。
#   3) server/dist 里有裸 specifier（index.js 的 '@hono/node-server'、'hono'，
#      chineseDays.js 的 'chinese-days'，expand.js 的 'cross-spawn'），tsc 不会
#      帮它们打包依赖——这些包都得进 extraResources（见下面 extraResources 里的
#      注释），否则子进程一 spawn 就是 ERR_MODULE_NOT_FOUND，只在产物挪出仓库
#      之后才会暴露。

appId: com.rockbenben.shiye
productName: 办事师爷
copyright: 个人使用

# ⚠️ **`desktop/package.json` 的 `author` 必须写成对象 `{ "name": "…" }`，不能是
# 字符串。** exe 属性里的 CompanyName 来自 `appInfo.companyName`，而那个 getter 是
# `author == null ? null : author.name`（`app-builder-lib/out/appInfo.js`）——字符串
# 形式取 `.name` 得 `undefined`，`winPackager` 那句 `!= null` 判空跳过，于是
# CompanyName 落回 **Electron 二进制自带的「GitHub, Inc.」**，安装包对外声称发行方
# 是 GitHub。不报错、不警告（`author` 字段存在，「author is missed」那条不会响），
# 只能在打出来的 exe 上看属性才发现。
#
# 验的时候注意：**改完必须先删掉 `desktop/release/win-unpacked` 再打。** 保留它的话
# electron-builder 会复用已解压的 Electron，连带跳过写版本号那一步，exe 时间戳纹丝
# 不动——照着旧二进制量，会得出「改了没用」的错结论（这里真的这样错过一次）。

directories:
  # desktop/ 是这份配置真正打包的「应用目录」（package.json + 编译出来的 dist/main.js
  # 都在这儿）；根目录的 package.json 是 npm workspaces 的壳，不是要打包的东西。
  app: desktop
  output: desktop/release
  buildResources: desktop/build

# 相对 directories.app（desktop/）。desktop 自己没有任何运行时依赖——electron
# 由 Electron 运行时本身提供，不用从 node_modules 里拷任何东西进去。
files:
  - dist/**/*
  - build/icon.png
  # package.json 里的 "type": "module" 必须原样带进包里：main.ts 编译出来的是
  # ESM（import/export），没有这份 package.json，Node 会把 dist/main.js 当成
  # CommonJS 解析，一启动就语法错误。
  - package.json

asar: true

# **build/icon.png 必须留在 asar 外面。** 它有两个消费者，走的是两套完全不同的
# 读取路径：
#   - 托盘图标 / 窗口图标：`new Tray(ICON_PATH)`、`icon: ICON_PATH`，走的是
#     Electron 的 nativeImage，那一层有 asar 感知的 fs 垫片，路径穿进 asar 也读得到；
#   - **Windows toast 通知的 `<image src="…">`**（notify.ts 的 buildToastXml，
#     main.ts 把它拼成 ICON_FILE_URL）：这份 XML 是交给 Windows.UI.Notifications
#     渲染的，**是操作系统在读这个文件，不经过 Electron 任何一层垫片**。
# 打进 asar 之后第二种就废了：`…\resources\app.asar\build\icon.png` 是一条穿过
# 一个「文件」的路径，系统打不开，于是每条提醒的 toast 都变成没有图的纯文字版——
# 不报错、不落日志，而托盘图标一切正常，所以这条极难被发现（实测确认过：
# `npx asar list …/app.asar` 里有 `\build\icon.png`，而 `resources/` 下既没有
# `build/` 也没有 `app.asar.unpacked/`）。
asarUnpack:
  - build/icon.png

# desktop/ 没有任何运行时依赖（electron 由运行时本身提供），没有原生模块要
# 重新编译——跳过这一步纯粹是省时间，不是绕开一个 bug。曾经怀疑过
# @electron/rebuild 会在这个 npm workspaces monorepo 里跑「installing native
# dependencies」那一步时把仓库根 package.json 整个替换成 desktop/package.json
# 的内容；重新测过：把这行改成 npmRebuild: true 跑一遍完整打包，根
# package.json 打包前后 md5 一致、git diff 为空，读 @electron/rebuild@4.2.0
# 源码也确认它只往 cache / clang / sysroot / .node 产物写文件，从不碰
# package.json——上面那个说法不成立，撤回。
npmRebuild: false

# **不发布，只出包。** 这一条不是可选的洁癖，是第一次推 tag 时三个平台一起红的
# 那个原因：electron-builder 看见当前提交上有 git tag 就会**隐式**打开发布流程
# （日志原话：`Implicit publishing triggered by git tag. This behavior will be
# disabled in electron-builder v27.`），而 `package.json` 的 `repository` 指向
# GitHub，于是它推断出 github provider、去找 `GH_TOKEN`，找不到就
# `⨯ GitHub Personal Access Token is not set` 退出码 1——**包其实已经全打完了**
# （dmg / zip / AppImage / exe 都在日志里 building 过），死在最后一步。
#
# 这个仓库没有接 `electron-updater`（全仓零引用），也就没有「自动更新源」这回事，
# 发布是 release workflow 用 softprops/action-gh-release 直接挂到 GitHub Release
# 的（upload-artifact 只留 90 天的调试档）。所以这里明确关掉：`app-update.yml`
# 和 `latest.yml` 那两份假的更新元数据也跟着不再生成（它们本来就名不副实——
# `latest.yml` 里的文件名是 `desktop-setup-0.1.0.exe`，而真实产物当时叫
# 「办事师爷 Setup 0.1.0.exe」——见下面 artifactName 那节，现在改成 ASCII 了）。
publish: null

# 全部相对仓库根（electron-builder 管这叫 projectDir，就是跑 npm run dist:desktop
# 时的 cwd）。to 是相对打包后 resources/ 目录的子路径。
extraResources:
  - from: server/dist
    to: server/dist
  # server/dist/*.js 是 tsc 直出，裸 specifier（import { serve } from
  # '@hono/node-server' 这种）要靠 Node 的 node_modules 向上查找解析；
  # <resources>/server/node_modules 正好在它的查找路径上（从
  # <resources>/server/dist/ 往上一级）。这三个包各自零传递依赖——
  # @hono/node-server 对 hono 只是 peerDependency；hono 没有 dependencies 字段；
  # chinese-days 的 main 是一个零依赖的 dist/index.min.js。npm workspaces 把它们
  # 都提到了仓库根 node_modules，所以只用各拷一份自己，不用管依赖树。不这么做的
  # 话打包后子进程一 spawn 就是 ERR_MODULE_NOT_FOUND：产物在仓库外时找不到仓库根
  # 的 node_modules。
  #
  # ⚠️ **chinese-days 这一条是 v0.1.0 / v0.1.1 两个版本的安装包实际点不开之后才补的**：
  # chineseDays.ts 把它 import 进了 server 的启动模块图，但这里只拷了 hono、
  # @hono/node-server 和（当时还在用的）dotenv，漏了它。CI 三个平台全绿，因为
  # 「包打得出来」和「打完的包里服务起得来」是两件事——后者没有任何一步在跑。
  # 本地守卫：把 extraResources 的布局在仓库外原样摆好真起一次服务——建临时
  # <r>/server/dist、<r>/server/node_modules、<r>/web/dist，照下面三份拷过去，
  # DATA_DIR=<tmp> node <r>/server/dist/index.js，再探 /api/health。以后 server
  # 每加一条运行时依赖，先扫编译产物里的裸包清单，照这张清单过：
  #   grep -rhoE "(from |import\()['\"][^.'\"][^'\"]*['\"]" server/dist --include=*.js
  #
  # dotenv 已经不在这份清单里：.env 改用 Node 自带的 process.loadEnvFile 读取
  # （index.ts），依赖删掉了；多留一条只会被 electron-builder 静默跳过——来源
  # 不存在时它只打 debug 日志、不报错，这也是漏拷 chinese-days 从没被构建拦住的
  # 原因之一。
  - from: node_modules/hono
    to: server/node_modules/hono
  - from: node_modules/@hono/node-server
    to: server/node_modules/@hono/node-server
  - from: node_modules/chinese-days
    to: server/node_modules/chinese-days
  # expand.ts 叫 AI CLI 用的是 cross-spawn（为什么不用原生 spawn，见 expand.ts
  # createAgentRunner 顶上那段 Windows .cmd 的实测）。它是 CJS、tsc 不打包，连同
  # 运行时依赖树一共六个包：cross-spawn → shebang-command → shebang-regex，
  # cross-spawn → which → isexe，外加 path-key。少任何一个，dev 下被根 node_modules
  # 提升盖住看不出来，打包后一选命令行模式就是 ERR_MODULE_NOT_FOUND。
  - from: node_modules/cross-spawn
    to: server/node_modules/cross-spawn
  - from: node_modules/shebang-command
    to: server/node_modules/shebang-command
  - from: node_modules/shebang-regex
    to: server/node_modules/shebang-regex
  - from: node_modules/which
    to: server/node_modules/which
  - from: node_modules/isexe
    to: server/node_modules/isexe
  - from: node_modules/path-key
    to: server/node_modules/path-key
  - from: web/dist
    to: web/dist
  - from: AGENTS.md
    to: AGENTS.md
  - from: workflows
    to: workflows

# ── artifactName：全 ASCII，而且必须自己带 `.${ext}` ──
#
# 下面两条各自都有实测事故的支撑，缺哪条都是**构建全绿、产物却不能用**。
#
# **① 不能写 `${productName}`（办事师爷）——GitHub 会把非 ASCII 从资产名里抹掉。**
# 这是 v0.1.2 第一次真发出 Release 才撞到的（v0.1.0 / v0.1.1 那两次只有
# upload-artifact，Releases 页面是空的）：electron-builder 打出来的文件**名字是对的**
# （`办事师爷-0.1.2-win.zip`，`sanitizedProductName` 原样返回中文，不是 builder 在动手），
# softprops 的日志也逐字打出了中文（`⬆️ Uploading 办事师爷-0.1.2-win.zip...`、
# `✅ Uploaded ...`），但传到 GitHub 上就变成 `-0.1.2-win.zip`——
# 前缀四个字没了，空格也没了（` Setup ` → `.`），于是安装包叫 `Setup.0.1.2.exe`。
# 日志里那句 `✏️ Restoring asset label to ...` 是它上传后用改名接口想改回去，
# 报了成功但没生效。用原始 API JSON 的字节核过（纯 ASCII），不是终端编码的假象。
#
# 那个 `-0.1.2-win.zip` 是 148 MB 的包，下载下来看不出是哪个应用。
# 于是这里显式给全 ASCII 的名字：`shiye-<version>-<平台>[-<架构>].<ext>`。
# README 和 `desktop/冒烟清单.md` 抄的也是这一份，`scripts/identity-literals.test.ts`
# 守两边一致。
#
# **② 必须自己带 `.${ext}`——`artifactName` 是逐字照抄的，builder 不帮你补扩展名。**
# v0.1.3 就是栽在这条（当时写的是 `shiye-${version}-win`，没有 `.${ext}`）：
# builder 日志逐字打出 `building target=zip arch=x64
# file=desktop\release\shiye-0.1.3-win`，7za 拿到一个没有扩展名的目标路径直接
# `System ERROR: The parameter is incorrect.` 退出 2；linux 那份 `shiye-0.1.3-linux`
# 同样没扩展名，`desktop/release/*.AppImage` 一个文件都匹配不到，
# `if-no-files-found: error` 把 ubuntu 那个 job 杀掉。
#
# mac 上更隐蔽，因为那个 job **还是绿的**：zip 和 dmg 两个 target 写的是**同一个路径**
# `desktop/release/shiye-0.1.3-mac-arm64`，dmg 在后面写把 zip 盖掉了，于是上传那步
# `🤔 Pattern 'desktop/release/*.zip' does not match any files`——两份 zip 静默丢失，
# Release 上只剩两个 dmg。dmg 自己能带上 `.dmg` 纯粹是 `hdiutil` 对缺扩展名的输出
# 自动补一个，跟 builder 无关，zip 那边没有任何兜底。
#
# 默认 pattern 是带扩展名的（`platformPackager.js` 的 `expandArtifactNamePattern`：
# `"${productName} ${version} ${arch}.${ext}"`），所以**不写** artifactName 时不会踩；
# 一旦自己写，就全靠自己。四个 target 各自传给它的 ext 是 NSIS `"exe"`、AppImage
# `"AppImage"`、dmg `"dmg"`、zip `"zip"`，`${ext}` 会被换成对应那一个。
#
# `${arch}` 在 mac 这边要留：两个架构各出一份，而 `artifactName` 用户指定之后
# `isUserForced` 为真，arch 后缀**不再被自动省略**（`platformPackager.js` 的
# `expandArtifactNamePattern` 那句 `!isUserForced && …`）——以前靠 builder 自动补的那个
# `-arm64` 只在 arm64 那份上出现，x64 那份是 `办事师爷-0.1.2.dmg`，两个 dmg 一个叫
# `0.1.2.dmg` 一个叫 `0.1.2-arm64.dmg`，看不出哪个是哪个。写进 pattern 之后两边都带。
# 顺手修掉了这个。
#
# linux 只出 x64，不用写 `${arch}`：写了会变成 `x86_64`（`getArtifactArchName` 对
# AppImage 专门把 x64 映射成 `x86_64`），多一个读者要猜的词。

win:
  artifactName: shiye-${version}-win.${ext}
  target:
    # **免安装那一份是 zip，不是 portable——这一条是实测撤下来的，别凭直觉换回去。**
    #
    # `portable` 打出来是「一个 exe 双击就跑」，听着正是免安装该有的样子，实际
    # 对这个体积的 Electron 应用完全不成立。它的 NSIS 模板
    # （node_modules/app-builder-lib/templates/nsis/portable.nsi）那段是无条件的：
    #
    #     StrCpy $INSTDIR "$TEMP\${UNPACK_DIR_NAME}"
    #     RMDir /r $INSTDIR              ; 每次先把整个目录删掉
    #     File /r "${APP_DIR_64}\*.*"    ; 再把全部文件重解压一遍
    #     ExecWait "$INSTDIR\${APP_EXECUTABLE_FILENAME} $R0" $0
    #     RMDir /r $INSTDIR              ; 退出后再删一遍
    #
    # **没有「已经解压过就复用」这回事**——`unpackDirName` 只决定那个临时目录
    # 叫什么名字，不决定复不复用（NsisTarget.js:246 只把它填进 UNPACK_DIR_NAME）。
    # 于是每一次双击都是：删 375 MB → 重解压 1954 个文件 → 跑 → 再删 375 MB。
    # 本机实测：点下去到窗口出来 **48 秒**，同一份 win-unpacked 直接跑是 **0.9 秒**。
    # 更糟的是模板顶上那句 `SetSilent silent`（没配 splashImage 时就是它），这
    # 48 秒里没有窗口、没有进度条、没有任何反馈——用户看到的就是「点了没反应」，
    # 然后多点几下，于是几个 stub 一起在解压。
    #
    # 配 `splashImage` 能让它不再「没反应」，但每次启动照样 ~50 秒、照样往磁盘
    # 来回写 750 MB，那是给症状盖张纸。zip 把「解压」这一步从每次启动挪到了
    # 一次性：解压出来的就是 win-unpacked 那份，之后每次双击都是 0.9 秒那条路。
    # 免安装的两个诉求（不用装、删掉文件夹就是卸载）一个没丢。
    - target: zip
    - target: nsis
  # icon 不用显式指——buildResources（desktop/build/）下按约定命名的 icon.png
  # 会被自动找到、自动转成 .ico。
  #
  # 不签名：个人使用，没有配置任何证书（CSC_LINK 等），electron-builder 默认
  # 就会跳过签名这一步，只在日志里提一句，不是错误。

nsis:
  # 个人用的桌面小工具，装哪儿、要不要建桌面快捷方式让用户自己选，不强制一键装。
  oneClick: false
  allowToChangeInstallationDirectory: true

# ── 协议注册：mac 和 Linux 靠打包时写进元数据 ──
#
# Windows 那条是**运行时**注册（main.ts 的 `app.setAsDefaultProtocolClient`），
# 另外两个平台不吃这一套：mac 认 Info.plist 里的 `CFBundleURLTypes`，Linux 认
# `.desktop` 文件里的 `MimeType=x-scheme-handler/…`，两份都只能在打包时生成。
# 没有这一段，通知上「完成」「推迟 10 分钟」两颗按钮在 mac/Linux 上点了不会有
# 任何反应——系统根本不知道 `todo-desktop://` 该交给谁。
#
# **`schemes` 必须跟 `desktop/src/notify.ts` 的 `PROTOCOL` 一字不差**：那个常量
# 是按钮拼 URI 用的同一个字面量，两边漂开的表现就是「点了没反应」，不报错。
protocols:
  - name: 办事师爷协议激活
    schemes:
      - todo-desktop

# ── macOS ──
#
# **`identity: null` = 不签名**，跟 Windows 那边同一个理由（个人使用，没买证书）。
# 但后果比 Windows 重得多：SmartScreen 点两下「仍要运行」就过去了，而 macOS 的
# Gatekeeper 对未签名、未公证的应用直接报「已损坏，无法打开」——**用户看到的
# 是「损坏」不是「未签名」**，不知道还有的救。绕过要右键「打开」，或者
# `xattr -d com.apple.quarantine /Applications/办事师爷.app`。README 的 SmartScreen
# 那段在 mac 上不成立，得单写一句。
#
# 图标：`desktop/build/icon.png` 现在是 512×512（`brand/render.mjs` 里改的），
# electron-builder 从它生成 .icns——**小于 512 直接报错打不出包**，那是只出
# Windows 的时候一直没暴露的一条。
# **两个架构都要出。** 只写 `- dmg` 的话 electron-builder 按**打包那台机器**的
# 架构出一份——`macos-latest` 是 Apple Silicon，于是第一次发布只出了 arm64，
# **Intel Mac 装不了**（实测确认：那次日志里三行全是 `arch=arm64`）。这件事不报
# 错、不警告，产物名里也只有一个 `-arm64`，不去数很难发现。
#
# 不用 `universal`（把两份塞进一个包）：体积翻倍而且下载的人每次都白拿一半，
# 分开两份反而是各取所需。x64 那份在 arm 机器上照样能打——`npmRebuild: false`，
# 没有原生模块要编译，electron-builder 只是多下一份 x64 的 Electron 运行时。
#
# Linux 和 Windows 目前都只出 x64，那是有意的：ARM 的 Windows 笔记本和 ARM 的
# Linux 桌面在这个应用的实际用户里都还不存在。哪天有了，照这里的写法加。
mac:
  artifactName: shiye-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  identity: null

# ── Linux ──
#
# **只出 AppImage，不出 deb。** deb 要求 `author` 带邮箱（electron-builder 拿它
# 当 Debian 的 maintainer 字段，缺了直接报错），而这个仓库的 `author` 有意只写
# 名字不写邮箱。AppImage 没这个要求，而且一个文件下载即用、删掉就是卸载，跟
# Windows 那边选 zip 而不是安装器是同一个偏好。
