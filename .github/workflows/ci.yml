# 干净克隆 + npm ci + 全量测试。
#
# **这个 workflow 在真 runner 上跑过 17 次。** 2026-09-03 那天连红 8 次——那批改动
# 还没跑通，「第一次 push 那次红了是预期内的」说的就是它；之后一路绿，最近一次是
# 2026-09-26。所以「全量测试在干净环境里是绿的」这件事**已经有真 runner 上的
# 证据**，不再只有本机这一份。
#
# （上一版这里写的是「**这个 workflow 至今没在真 runner 上跑过一次**」——那是仓库
# 还没有远程、workflow 刚接上的那阵子写的，那时候确实一次都还没跑过。别再照着
# 那句话推「这套测试没被验证过」。）
#
# ⚠ **但「只在 windows-latest 上跑过」这条仍然成立**——下面「为什么只有
# windows-latest」「为什么只钉 node 24」两条决定的前提（这套测试从没在别的环境
# 跑过）原样成立；变的是上面那句「没被验证过」。
#
# ── 为什么只有 windows-latest ──
#
# 这套测试从来没有在 Linux 上跑过一次。server 那边好几处测试要绕开
# 「机器真实的 %APPDATA%\shiye\device.json」，desktop 又有
# `cpSync(x, x)` 的路径归一化判断（`agentFiles.ts` 里 `resolve()` 那条），
# 都是平台相关的。加一条 ubuntu 只会得到一个没法在本地复现的红。
# 要加就等这里绿了之后单独做一次，那时候 ubuntu 报出来的才是真的平台假设。
#
# ── 为什么只钉 node 26 ──
#
# Node 26 是当前这一条发布线（2026-10 从 24 手上接过来），`engines.node` 同步
# 改成 `>=26.0.0`（原来是 `>=24.0.0`）。
#
# **CI 跑的比应用自己跑的更新，这条要说清楚**：桌面端捆的 Electron 45 自带
# Node 24.22.0（`ELECTRON_RUN_AS_NODE=1` 跑 `process.versions.node` 核过），
# 而 CI 和开发机都跑 26——**测的是更新的那条线，不是应用内嵌的那条**。
# 这么选的理由是：Node 26 就是当前发布线，开发机装的是它；而应用内嵌的
# Node 由 Electron 说了算，**钉不了**（Electron 45 是当前最新版，没有更靠
# 后的版本能带上 Node 26）。等 Electron 46 出来、它捆的是 Node 26，两边
# 就自动齐了。
#
# **升 Electron 45 时核过它的破坏性变更**：这一版动的是 iframe 的
# nodeIntegration、chrome-extension 的 preload、`chromeMediaSource: 'desktop'`
# 约束，还有 asar 里 `fs.open` 返回的描述符不再指向临时副本——**这四条本仓
# 一条都没用到**（desktop/src 里 grep desktopCapturer / chromeMediaSource /
# nodeIntegration / fs.open 全是零命中），唯一影响到本仓的是它内置的 Node
# 从 24.19.0 升到 24.22.0。
#
# 顺带记一笔：改之前在 node 20.20.2 上实跑过 1852 条，全绿——所以那次收窄
# 不是因为 20 跑不过，是因为「声明支持而 CI 不跑」和「不声明」之间，
# 后者诚实。要重新支持 20，先把它加回矩阵再改 engines，别只改一头。
#
# ── Electron 二进制 ──
#
# Electron 42 起不再在 postinstall 下载二进制，`ELECTRON_SKIP_BINARY_DOWNLOAD`
# 也已经不在 Electron 45 的 `install.js` 里了——那个环境变量现在是个空操作，
# 留着只会让人以为它在省下载。
#
# `desktop/src/main.test.ts` 确实 `import { app } from 'electron'`，但
# `vi.mock('electron', factory)` 在模块解析阶段就替换掉了，`electron/index.js`
# 那句 `getElectronPath()`（不存在就现场下载）不会执行。实测把 `node_modules/electron`
# 的 `dist/` 和 `path.txt` 都挪走再跑 `desktop/src/`，**197 条全绿**。
# 这里不跑 `npx install-electron`，因为这一 job 不做打包；真正出包的 Release
# 由 electron-builder 自己下载它需要的 Electron zip（见 release.yml 的注释）。
#
# ── 不跑 `dist:desktop` ──
#
# electron-builder 出安装包每次几分钟、产物几百 MB。CI 该守的是「还编得过、
# 测试还全绿」。要出包等有 release 流程时按 tag 单开一个 workflow。

name: CI

# 这个 workflow 只读代码：不发包、不写 release、不碰 issue。
# 令牌按最小权限收窄——`contents: read` 只够 clone，别的（issues、packages、
# actions）一律不给。仓库设置里的默认权限可能是「读写一切」，写在这里就
# 不依赖那个默认值了。
permissions:
  contents: read

# 同一个分支连着推几次，前一次还没跑完就取消掉，省 runner 也省时间。
# ⚠️ **main 上不取消**：那几次跑的是**已经合进去**的提交，取消掉等于那个提交
# 从来没被验过——和这个文件开头「一个从没跑过的 workflow 不算数」是同一条。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    name: windows · node 26

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # runner 的规格。`vitest.config.ts` 的 MAX_WORKERS 是按核数算的，出问题时
      # 要能对着这几个数看——第二、三次 CI 红在「一个 worker 非正常退出」，而
      # 日志里既没有断言失败也没有 OOM 字样，只能靠这些外部条件推。
      - name: runner 规格
        run: node -e "const os=require('node:os');console.log('node',process.version,'| 核',os.availableParallelism(),'| 内存GB',(os.totalmem()/2**30).toFixed(1),'| 空闲GB',(os.freemem()/2**30).toFixed(1),'| TZ',Intl.DateTimeFormat().resolvedOptions().timeZone)"

      # （这里一度有一步「单独跑 events.test.ts」。那是定位实验，不是守卫，用完
      # 撤掉了。它当时是唯一有效的手段：全量输出五千多行，进程 abort 时那行
      # `src\win\fs-event.c:72` 的 native 断言被淹得看不见，单独跑才显形。
      # 以后再遇到「零失败用例 + Worker exited unexpectedly」，先把嫌疑文件单拎
      # 出来跑一遍——比在全量日志里翻快得多。）

      # `npm test` 里面已经含 typecheck（web + server + desktop 三个 tsconfig）
      #
      # `--reporter=verbose`：默认 reporter 在非 TTY 下**不打逐文件结果**，于是
      # 「169 个文件里有 1 个没跑完」这种情况在日志里根本查不出是哪一个（试过：
      # 完整日志里一条 `(N tests)` 都没有）。verbose 逐条打、每行带文件名，崩掉的
      # 那个文件就是清单里缺的那个。纯诊断，不改任何执行行为。
      #
      # **不是 `basic`**：vitest 4 里没有这个 reporter，写上去会在加载 reporter 时
      # 直接抛（`loadCustomReporterModule`），整个 job 挂在配置错误上——本机验过。
      - run: npm test -- --reporter=verbose
      - run: npm run build
