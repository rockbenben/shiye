<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="办事师爷">
  <title>办事师爷</title>
  <!--
    圈点。白文没有标点，读的人在字旁画小圈，把连成一片的字断成句、标出要紧处
    ——这正是这个应用对一句随手记做的事。

    三道竖笔是你写的那几行（竖排从右往左读，所以最右那行最长、最左那行收在
    半途，像一段话正好写完）。群青那一枚圈嵌在第一行和第二行之间的行间里，
    位置就是句读该落的地方。

    配色全部取自 web/src/theme.css 的 :root，一个新颜色都没引：
    纸 #FAF8F5 / 界 #D4CEC3 / 你的墨 #211F1D / 师爷的墨 #2E3ED4。
    （那一排中性色是**暖**的，色相 30–40°——界面从蓝灰换成暖纸那一轮跟着换的，
    印不能比它承载的界面更冷。）
    **群青只有那一枚圈**——它是这个应用「配给制」那条规矩本身的样子，
    而不是像旧图标那样把整块底都刷成群青。
  -->
  <rect x="1.5" y="1.5" width="253" height="253" rx="30" fill="#FAF8F5" stroke="#D4CEC3" stroke-width="3"/>
  <!--
    行距不均是有意的：画圈的那一行留宽。真手稿里句读要落在行间，那一道行间
    本来就得让出地方——第一版三行等距，圈嵌进 28px 的行间里两边都贴着笔画，
    64px 下糊成一团（实拍过）。现在右边两行之间是 52px，圈两侧各留 8px。
  -->
  <g fill="#211F1D">
    <rect x="175" y="62" width="14" height="132" rx="7"/>
    <rect x="109" y="62" width="14" height="104" rx="7"/>
    <rect x="67"  y="62" width="14" height="72"  rx="7"/>
  </g>
  <circle cx="149" cy="106" r="14.5" fill="none" stroke="#2E3ED4" stroke-width="6"/>
</svg>
