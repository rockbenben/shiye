# 办事师爷桌面版发布：tag 是版本源；validate → 三平台打包 → 单一 publish。
#
# 重要约定（改之前先读）：
# - **tag 必须和 desktop/package.json 的 version 一致**。产物名和 latest.yml 里的
#   版本号都来自后者；对不上时 Release 看着正常，但 Windows 更新会永远看不到新版本。
# - **每个平台一个 job，同一 OS 的全部架构在同一 job 里打**；mac 配置里已经是
#   arm64 + x64 两份，分别出 dmg 和 zip。
# - **build 只上传 Actions Artifacts，不直接发 Release**；publish 是唯一写 Release
#   的 job。这样任何一个平台失败都不会留下一个缺 Windows latest.yml 的半成品发布。
# - **publish 需要在仓库 Settings → Environments 里建一个 `release` 环境并加
#   required reviewers**；没配置时 GitHub 会自动建一个无保护环境，仍然只有单一
#   publish job 的结构约束。不配置审批就不算真正的人工门禁。
# - **Electron 二进制**：Electron 42 起没有 postinstall 下载；build job 里显式
#   `npx install-electron`。electron-builder 仍可使用自己的 Electron 缓存；
#   `ELECTRON_SKIP_BINARY_DOWNLOAD` 已从 Electron 移除，不要再设置。
# - **产物名必须全 ASCII 且带 `.${ext}`**；原因和命名规则在
#   desktop/electron-builder.yml 的 artifactName 一节，别在 workflow 里另起一套。
# - **macOS/Windows 目前未签名**；README 已写 Gatekeeper/SmartScreen 的打开方式。
#   这是 .desktop-policy.json 里记录的偏离，签名后记得更新那份策略和 README。
# - **macOS/Linux 的自动更新未接线**；latest.yml 只有 Windows 的 NSIS 那趟产出。
#   不要让 publish 去校验不存在的 latest-mac.yml / latest-linux.yml。

name: Release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  # 手动跑只做打包演练：没有 tag，publish job 会被 if 收住，只留 Artifacts。
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # 手动演练没有 tag，这一步跳过；tag 发布必须过版本对账。
      - name: tag 与 desktop/package.json 的版本对账
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::version mismatch: tag $GITHUB_REF_NAME != desktop/package.json $PKG_VERSION"
            echo "::error::产物会按 $PKG_VERSION 命名却挂在 $GITHUB_REF_NAME 上，electron-updater 读的是前者，用户会一直收不到更新。"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME 与 desktop/package.json 的 $PKG_VERSION 一致 ✓"

      # 发布门禁跟 CI 用同一条 `npm test`（typecheck + 全量 vitest）。
      - run: npm test -- --reporter=verbose

  build:
    needs: validate
    strategy:
      # 一个平台挂了，另外两个照打；但 publish 有 needs: build，任何一个失败都不会发。
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # Electron 42 起没有 postinstall 下载；显式装一次，让任何读
      # node_modules/electron/dist 的打包/检查步骤都有二进制可用（builder 仍可
      # 使用自己的 Electron 缓存）。它是 electron 包的 bin，不能写成 npm run。
      - run: npx install-electron

      # 里面含 npm run build（web + server）和 desktop 的 tsc。
      - run: npm run dist:desktop

      # 只捞最终产物，不要 win-unpacked / mac 的 .app 目录。
      # latest.yml 和 .exe.blockmap 只有 Windows NSIS 那趟产出；mac/ubuntu 的空匹配
      # 不会让 if-no-files-found: error 变红（至少会命中 dmg/zip/AppImage）。
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/latest.yml
            desktop/release/*.exe.blockmap

  publish:
    needs: [validate, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # release environment 已配置 required reviewer（rockbenben，2026-10-25）；
    # 删掉保护规则等于删掉人工审批点。
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: 校验产物与 updater 清单
        shell: bash
        working-directory: dist
        run: |
          VERSION="${TAG#v}"
          require() {
            compgen -G "$1" >/dev/null || { echo "::error::missing asset pattern: $1"; exit 1; }
          }

          # 当前矩阵：Windows x64、macOS arm64+x64、Linux x64；格式跟
          # .desktop-policy.json 的 platforms/deviations 保持一致。
          require 'shiye-*-win-setup.exe'
          require 'shiye-*-win.zip'
          require 'shiye-*-mac-arm64.dmg'
          require 'shiye-*-mac-x64.dmg'
          require 'shiye-*-mac-arm64.zip'
          require 'shiye-*-mac-x64.zip'
          require 'shiye-*-linux.AppImage'
          require 'latest.yml'
          require 'shiye-*-win-setup.exe.blockmap'

          grep -q "^version: ${VERSION}$" latest.yml \
            || { echo "::error::latest.yml version does not match tag ${TAG}"; exit 1; }
          while read -r url; do
            [ -f "$url" ] || { echo "::error::latest.yml references missing $url"; exit 1; }
          done < <(grep -E '^\s*-?\s*url:' latest.yml | awk '{print $NF}')

      - name: SHA256SUMS（Linux 上生成，LF）
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: 建草稿并上传全部资产
        shell: bash
        run: |
          if gh release view "$TAG" -R "$REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$TAG is already published; bump the version instead of reusing the tag"
            exit 1
          fi
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$REPO" --draft --verify-tag \
                 --title "$TAG" --generate-notes
          gh release upload "$TAG" -R "$REPO" dist/* --clobber

      - name: 发布并设为 latest
        shell: bash
        run: |
          id=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name==\"$TAG\" and .draft) | .id")
          [ -n "$id" ] || { echo "::error::no draft found for $TAG"; exit 1; }
          latest=true
          case "$TAG" in *-*) latest=false;; esac
          gh api -X PATCH "repos/$REPO/releases/$id" \
            -F draft=false -f make_latest=$latest >/dev/null

      - name: 发布后匿名核验（只对稳定版）
        if: ${{ !contains(env.TAG, '-') }}
        shell: bash
        run: |
          [ "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG" ] \
            || { echo "::error::releases/latest is not $TAG"; exit 1; }
          VERSION="${TAG#v}"
          ok=
          for _ in $(seq 1 10); do
            if curl -fsSL "https://github.com/$REPO/releases/latest/download/latest.yml" \
              | grep -q "^version: ${VERSION}$"; then ok=1; break; fi
            sleep 60
          done
          [ -n "$ok" ] || { echo "::error::public latest.yml is still stale after 10 minutes"; exit 1; }
          echo "releases/latest 和公开 latest.yml 都指向 $TAG ✓"
