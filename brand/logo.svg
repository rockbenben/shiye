<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 128" role="img" aria-label="办事师爷">
  <title>办事师爷</title>
  <!--
    横排组合：印 + 字标。字标沿用应用顶栏那一套（宋体、0.24em 字距，后面一枚
    群青的点）——那颗点跟印里那一枚圈是同一样东西，只是小到挖不出中间的空。

    **字是活字不是轮廓**：这台机器上有宋体，渲成 PNG（brand/logo.png）就是它
    该有的样子；直接把这个 .svg 挂到 GitHub 上则会退成对方环境里的衬线体。
    要贴到 README 或别处，用 PNG 那份。
  -->
  <g transform="translate(0,0) scale(0.5)">
    <rect x="1.5" y="1.5" width="253" height="253" rx="30" fill="#FAF8F5" stroke="#D4CEC3" stroke-width="3"/>
    <g fill="#211F1D">
      <rect x="175" y="62" width="14" height="132" rx="7"/>
      <rect x="109" y="62" width="14" height="104" rx="7"/>
      <rect x="67"  y="62" width="14" height="72"  rx="7"/>
    </g>
    <circle cx="149" cy="106" r="14.5" fill="none" stroke="#2E3ED4" stroke-width="6"/>
  </g>
  <text x="160" y="82" fill="#211F1D"
        font-family="Songti SC, SimSun, Noto Serif SC, Constantia, Cambria, serif"
        font-size="52" letter-spacing="12.5">办事师爷</text>
  <!-- 那颗点紧跟在「爷」后面：字号 52、字距 12.5，四个字占 4×52 + 4×12.5 = 258，
       从 x=160 起排到 418，末尾那 12.5 是字距的尾巴——所以字面实际收在 ~405，
       点摆在 424（中间空出约 14）。第一版拍脑袋写了 512，点飘在半空。 -->
  <circle cx="424" cy="72" r="5.5" fill="#2E3ED4"/>
</svg>
