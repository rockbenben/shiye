# 打三个平台的桌面版产物，并挂到 GitHub Release 上。
#
# 历史：v0.1.0 / v0.1.1 两个 tag 这个 workflow 都跑绿过，但当时最后一步只有
# upload-artifact——包只放在 Actions 页的 Artifacts 里（要登录、90 天过期），
# Releases 页面是空的。下面「发到 Release」那一步就是补这个缺的。
#
# ── 为什么必须是矩阵，不能一台机器全包 ──
#
# **macOS 的包只能在 macOS 上打。** dmg 要 hdiutil，.icns 要 iconutil，都是系统
# 自带的东西，Windows/Linux 上没有替身。Linux 的 AppImage 理论上能在别的系统上
# 用容器打，但那是另一套复杂度。所以三个 runner 各打各的，谁也不替谁。
#
# ── Release 这一步为什么每个平台各自发，不汇总成一个 job ──
#
# electron-builder 官方文档给 GitHub Actions 的多平台模式就是这样：矩阵的每个
# job 打完直接用 softprops/action-gh-release 往**同一个 tag 的 Release** 上挂
# （这个 action 对「Release 已存在」的处理是更新它，不是报错），不互相等。
# 这正好配合下面 fail-fast: false 的态度——一个平台红了，另外两个照打照发，
# 发布时手上有两个能下的包，比三个都没有强。三个 job 完成时刻差着几分钟，
# 抢建同一个 Release 的概率很低，抢了也是「更新」语义。
#
# ── 为什么不跑测试 ──
#
# ci.yml 已经在 windows 上跑全量了，而那套测试**从没在 mac/Linux 上跑过一次**
# （理由写在 ci.yml 里：server 有几处要绕开真实的 device.json，desktop 有
# 路径归一化的平台假设）。在这里顺手加一条 `npm test` 只会得到两个没法在本地
# 复现的红，把「出包」这件事也一起拦下。要跑就单独做一次，别搭在发布路上。
#
# ── ELECTRON_SKIP_BINARY_DOWNLOAD ──
#
# 跟 ci.yml 同一个理由，而且这里更明确：**electron-builder 不用
# `node_modules/electron/dist` 那份二进制**，它按 package.json 里的版本号自己
# 下一份 zip 到缓存（本机打包日志里那两行 `downloaded label=electron` /
# `downloaded electron zip extracted successfully` 就是它）。postinstall 那次
# 下载在这条路上纯属浪费，一个 job 省掉上百 MB。
#
# ── 签名 ──
#
# 三个平台都不签（个人使用，没买证书）。后果各不相同，README 里各写了一句：
# Windows 是 SmartScreen 拦一次；**macOS 是 Gatekeeper 直接报「已损坏」**，
# 用户看不出这是「没签名」；Linux 的 AppImage 没有这一层。

name: Release

# 建 Release 要写仓库内容；仓库设置里 Actions 权限若是只读，这条会让 workflow
# 级别拿到 contents: write（softprops 官方 README 的要求）。
permissions:
  contents: write

# 同一个 tag 连着推两次，两趟会同时往**同一个 Release** 上挂资产——写的是同一
# 批文件名，谁后传谁覆盖，中途还可能撞上「文件已存在」。这里让它们排队，
# 一次只跑一趟。
#
# ⚠️ **发布这条不取消**：取消掉等于一个 Release 挂了一半（Windows 的包传上去了、
# mac 的还没传），而 app.asar 那些资产名是固定的，重跑能不能覆盖干净还得看
# 当时的时序。宁可多等几分钟。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  # 手动也能跑一次，不用为了试它专门打一个 tag。手动跑没有 tag，下面发 Release
  # 那步会被 if 收住——只出 Artifacts，等于一次免费的打包演练。
  workflow_dispatch:

jobs:
  build:
    strategy:
      # 一个平台挂了，另外两个照打完照发 Release——发布时手上有两个能用的包，
      # 比三个都没有强（见顶上「为什么各自发」）。
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # ── tag 与产物名要能对上 ──
      #
      # **产物的名字来自 `desktop/package.json` 的 version，不是来自 tag。**
      # electron-builder 的 `app: desktop` 指的就是那个目录，builder 打出来的
      # 是 `shiye-<desktop/package.json 里那个版本>-win-setup.exe`；而 Release
      # 是挂在 tag `v<版本>` 上的。两边对不上的时候**肉眼看不出来**（Release
      # 页面上就是几个资产），但自动更新就废了：electron-updater 读的是
      # latest.yml 里那个版本号，装的机器拿它跟本机版本比——对不上就永远
      # 看不到更新，而且没有任何报错。
      #
      # 所以在这儿拦一道：不对上就别出包（失败的代价是几分钟，出错包的代价是
      # 用户几个月收不到更新还查不出原因）。
      #
      # 手动跑（workflow_dispatch）没有 tag，这一步跳过——那是一次打包演练。
      - name: tag 与 desktop/package.json 的版本对账
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 desktop/package.json 的 $PKG_VERSION 对不上——产物会按 $PKG_VERSION 命名却挂在 $GITHUB_REF_NAME 上，electron-updater 读的是前者，用户会一直收不到更新。先把版本号改一致再打这个 tag。"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME 与 desktop/package.json 的 $PKG_VERSION 一致 ✓"

      # 里面已经含 npm run build（web + server）和 desktop 的 tsc。
      - run: npm run dist:desktop

      # 留一份在 Actions Artifacts（90 天）：发布后若有人报「这个包装不上」，
      # 不用现打一遍就能拿回当次的包和中间产物对照。真正给人下载的是下面 Release
      # 那步挂的资产，不是这里。
      #
      # 只捞最终产物，不要 win-unpacked / mac 那个 .app 目录——那两个是打包
      # 中间态，几百 MB，上传上去没人会去下。
      #
      # 末两行是自动更新要用的元数据：latest.yml 是 electron-updater 读的版本
      # 清单，.exe.blockmap 给安装包做增量下载。它们**只有 Windows NSIS 那趟
      # job 会产出**，但照样放进三份共享清单——if-no-files-found: error 判的是
      # 「整个步骤一个文件都没匹配到」，mac/ubuntu 至少命中前面四个模式里的
      # 一个，多几条空匹配的模式不会把那两个 job 染红，不需要按平台分支。
      # 这两个文件之所以落在盘上：electron-builder.yml 的 publish: 块加上
      # dist:desktop 的 --publish never，builder 只写不传（这两样是否真的产出，
      # 由计划 Task 6 的一次真打包核验坐实），上传归下面那步。
      # **v7 不是追新，是 v4 已经停在 2025-03 了**（v4.6.2 之后没有再发）。
      # 中间三版的变更对这条用法都没有影响：v5 切 Node 24 runtime、v6 正式
      # 跑在 node24 上（要求 runner ≥ 2.327.1，GitHub 托管的 runner 早就够）、
      # v7 改成 ESM 并多了一个「直传单个文件不打包」的可选参数。**这三样都没
      # 动 `name` / `path` / `if-no-files-found`**：下面传的是多个文件的
      # glob，走的还是压缩上传那条路。
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/latest.yml
            desktop/release/*.exe.blockmap

      # 挂到这个 tag 的 GitHub Release。electron-builder 官方文档给多平台矩阵的
      # 模式就是每个 job 各自往同一个 Release 发。
      #
      # v3 不是追新：**v2 已停止维护，跑在 Actions 淘汰中的 Node 20 runtime 上**
      # （softprops 自己 README 写的：v2.6.2 是最后一个 v2）。
      #
      # 资产名全是 ASCII（`shiye-0.1.3-win-setup.exe` / `-win.zip` 这种），跟本地
      # 打出来的名字一致，不在这里另起一套。glob 匹配不到别的平台的扩展名是正常的
      # （if 只在真有 tag 时才跑这一步，fail_on_unmatched_files 默认 false，缺一个
      # 模式不报错）。末两行 latest.yml / *.exe.blockmap 只有 Windows 那趟产出
      # （见上面 Artifacts 那步的注释），mac/ubuntu 上空匹配就是这同一种情况，
      # 更新全靠这两份文件挂上 Release，缺了它们装好的应用永远查不到新版本。
      #
      # **别把 artifactName 改成带中文的。** v0.1.2 是第一次真发出 Release，实测
      # GitHub 会把非 ASCII 从资产名里抹掉：builder 打出来的是
      # `办事师爷-0.1.2-win.zip`（日志逐字打印得出来），传上去变成 `-0.1.2-win.zip`，
      # softprops 那句 `Restoring asset label to ...` 报成功但改不回去。原因和
      # 现在的命名都在 `desktop/electron-builder.yml` 的 artifactName 那节。
      #
      # **`artifactName` 也必须带 `.${ext}`。** v0.1.3 那次写的是 `shiye-${version}-win`
      # （没扩展名），builder 打出的文件就是没扩展名的，于是上面那四个 glob 一个都
      # 匹配不到：macos 的 `Pattern 'desktop/release/*.zip' does not match any files`
      # 两份 zip 静默丢失而 job 是绿的，ubuntu 的 `if-no-files-found: error` 直接红。
      # 现在三条都是 `…-${ext}`，`scripts/identity-literals.test.ts` 守着不退回。
      #
      # 重跑幂等：同一个 tag 重跑，action 发现 Release 已存在就更新它；同名资产
      # 会被覆盖。
      #
      # **`generate_release_notes` 只在一个 job 上开，三个一起开会把生成说明堆三份。**
      # v0.1.3 的 Release 说明就是三行一模一样的话——每个 job 各生成一次，后面两个
      # 更新 Release 时不是替换而是**追加**。action 的实现（@v3，SHA
      # efb35369e0ad2afab669f228072c1b0d510eae64）：
      #   `src/github.ts:688-695` 没传 body/body_path 时 `workflowBody` 是 `''`，
      #     于是 `body = workflowBody || existingReleaseBody`——**把已有正文原样带回**；
      #   `src/github.ts:241-246` 再生成一份新说明，`body` 非空就
      #     `body = body + '\n\n' + 新说明`。
      # 于是第 1 个 job 建 Release（正文空，只 1 份）、第 2 个 2 份、第 3 个 3 份。
      # action 源码里那行注释自己就承认了（`revisit: support a new
      # body-concat-strategy input … previously this was duplicating content for
      # most which no one wants`）。
      #
      # 关掉 `generate_release_notes` 时那段代码整块跳过，`body` 原样通过——所以
      # 三个里选一个开就够，选哪个都能得到一份。选 ubuntu：它只出 AppImage，
      # 跑得最快，最可能第一个把 Release 建出来。代价是 ubuntu 那个 job 红了就
      # 没有自动说明（包还在，只是说明要手动补）。要彻底保证得加一个 `needs: build`
      # 的汇总 job，那会让三个平台互相等——和上面「fail-fast: false，各发各的」
      # 的态度相反，不值。
      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: ${{ matrix.os == 'ubuntu-latest' }}
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/latest.yml
            desktop/release/*.exe.blockmap
